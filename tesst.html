<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gesture Particles — 3D Hand-Controlled Effects</title>
    <meta name="description" content="Interactive 3D particle effects controlled by hand gestures via webcam. Built with Three.js and MediaPipe.">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

    <!-- MediaPipe (classic scripts) -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils@0.3/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils@0.3/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4/hands.js" crossorigin="anonymous"></script>

    <!-- Three.js import map -->
    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.163.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.163.0/examples/jsm/"
        }

    </script>

    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background: #050510;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            color: #e0e0e0;
        }

        /* ---------- Three.js Canvas ---------- */
        #three-canvas {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        /* ---------- Loading Screen ---------- */
        #loading-screen {
            position: fixed;
            inset: 0;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #050510;
            transition: opacity 0.6s ease;
        }
        #loading-screen.hidden { opacity: 0; pointer-events: none; }

        .spinner {
            width: 48px; height: 48px;
            border: 3px solid rgba(255,255,255,0.1);
            border-top-color: #a78bfa;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        #loading-screen p {
            margin-top: 16px;

        /* ---------- Webcam Overlay ---------- */
        #webcam-container {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 260px;
            height: 195px;
            border-radius: 16px;
            overflow: hidden;
            z-index: 10;
            border: 1px solid rgba(255,255,255,0.12);
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(12px);
            box-shadow: 0 8px 32px rgba(0,0,0,0.4);
        }
        #webcam-video { display: none; }
        #webcam-canvas {
            width: 100%;
            height: 100%;
            transform: scaleX(-1);
            border-radius: 16px;
        }

        /* ---------- Glass Panel (Status) ---------- */
        .glass-panel {
            position: fixed;
            z-index: 10;
            background: rgba(15, 15, 30, 0.65);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 16px;
            padding: 16px 20px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
        }

        #status-panel {
            bottom: 20px;
            left: 20px;
        }
        #status-panel h3 {
            font-size: 11px;

        /* ---------- Responsive ---------- */
        @media (max-width: 768px) {
            #webcam-container { width: 160px; height: 120px; bottom: 12px; right: 12px; border-radius: 12px; }
            #status-panel { bottom: 12px; left: 12px; padding: 12px 14px; }
            #instructions-panel { display: none; }
            #controls-panel { top: 12px; right: 12px; padding: 10px 14px; }
        }
    </style>
</head>
<body>
    <!-- Loading -->
    <div id="loading-screen">
        <div class="spinner"></div>
        <p>Initializing hand tracking…</p>
    </div>

    <!-- Three.js canvas target -->
    <canvas id="three-canvas"></canvas>

    <!-- Webcam overlay -->
    <div id="webcam-container">
        <video id="webcam-video" playsinline></video>
        <canvas id="webcam-canvas"></canvas>
    </div>

    <!-- Status panel -->
    <div id="status-panel" class="glass-panel">
        <h3>Status</h3>
        <div class="status-row"><span class="dot" id="dot-shape"></span><span id="txt-shape">Shape: Heart</span></div>
        <div class="status-row"><span class="dot" id="dot-state"></span><span id="txt-state">State: Forming</span></div>
        <div class="status-row"><span class="dot" id="dot-hands"></span><span id="txt-hands">Hands: —</span></div>
    </div>

    <!-- Controls -->
    <div id="controls-panel" class="glass-panel">
        <label for="color-picker">Particle Color</label>
        <input type="color" id="color-picker" value="#ff6b9d">
    </div>

    <!-- Instructions -->
    <div id="instructions-panel" class="glass-panel">
        <h3>Controls</h3>
        <ul>
            <li>✋ Left 1 finger → <span>Heart</span></li>
            <li>✌️ Left 2 fingers → <span>Tree</span></li>
            <li>✊ Right fist → <span>Form</span></li>
            <li>🖐️ Right open → <span>Explode</span></li>
        </ul>
    </div>

    <!-- App module -->
    <script type="module">
// ============================================================
// app.js — Gesture-Controlled 3D Particle Effects
// Three.js (particles + bloom) + MediaPipe Hands (gestures)
// ============================================================
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

// ── Constants ──────────────────────────────────────────────
const IS_MOBILE = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent) || window.innerWidth < 768;
const PARTICLE_COUNT = IS_MOBILE ? 3000 : 8000;
const LERP_SPEED = 0.04;          // How fast particles form back
const EXPLODE_FORCE = 0.4;        // Base explosion velocity
const DRAG = 0.97;                // Velocity damping each frame
const FLOAT_AMPLITUDE = 0.15;     // Subtle floating intensity
const GESTURE_DEBOUNCE_MS = 300;  // Prevent gesture flicker
const ROTATION_LERP = 0.06;       // How fast rotation follows hand

// ── State ──────────────────────────────────────────────────
const state = {
    currentShape: 'heart',   // 'heart' | 'tree'
    isExploding: false,
    particleColor: new THREE.Color('#ff6b9d'),
    handsDetected: 0,
    leftGesture: '',
    rightGesture: '',
    // Right hand rotation tracking (normalized 0-1 from MediaPipe)
    rightHandX: 0.5,
    rightHandY: 0.5,
    hasRightHand: false,
};

// Smooth rotation targets
let rotTargetY = 0;
let rotTargetX = 0;
let rotCurrentY = 0;
let rotCurrentX = 0;

let lastShapeSwitch = 0;
let lastExplosionToggle = 0;

// ── DOM refs ───────────────────────────────────────────────
const canvas3D = document.getElementById('three-canvas');
const loadingScreen = document.getElementById('loading-screen');
const colorPicker = document.getElementById('color-picker');
const dotShape = document.getElementById('dot-shape');
const dotState = document.getElementById('dot-state');
const dotHands = document.getElementById('dot-hands');
const txtShape = document.getElementById('txt-shape');
const txtState = document.getElementById('txt-state');
const txtHands = document.getElementById('txt-hands');

// ============================================================
// 1. SHAPE GENERATORS
// ============================================================

/**
 * Generate 3D heart using the classic parametric curve extended into 3D.
 * 50% surface particles for clear silhouette + 50% interior fill for density.
 */
function generateHeart(count) {
    const pos = new Float32Array(count * 3);
    const scale = 0.18;

    for (let i = 0; i < count; i++) {
        const t = Math.random() * Math.PI * 2;

        // Classic heart curve point (the outline)
        const outlineX = 16 * Math.pow(Math.sin(t), 3);
        const outlineY = 13 * Math.cos(t) - 5 * Math.cos(2 * t)
                       - 2 * Math.cos(3 * t) - Math.cos(4 * t);

        // Distance from center → used for z-depth
        const dist = Math.sqrt(outlineX * outlineX + outlineY * outlineY);

        // Distribution: 50% near surface, 50% interior (denser fill)
        let fillFactor;
        if (Math.random() < 0.5) {
            // Surface particles: scale 0.88–1.05 of outline
            fillFactor = 0.88 + Math.random() * 0.17;
        } else {
            // Interior: sqrt distribution biases toward outer region for fullness
            fillFactor = Math.sqrt(Math.random()) * 0.87 + 0.05;
        }

        const x = outlineX * fillFactor;
        const y = outlineY * fillFactor;

        // Z-depth: pillow/lens shape — thickest at center, thin at edges
        const depthScale = fillFactor * dist * 0.25;
        const z = (Math.random() - 0.5) * 2 * depthScale;

        // Add fuzzy noise for cloud-like edges
        const noise = 0.5;
        pos[i * 3]     = (x + (Math.random() - 0.5) * noise) * scale;
        pos[i * 3 + 1] = (y + (Math.random() - 0.5) * noise) * scale;
        pos[i * 3 + 2] = (z + (Math.random() - 0.5) * noise * 0.5) * scale;
    }
    return pos;
}

/** Generate Christmas tree: layered cone + trunk + star */
function generateTree(count) {
    const pos = new Float32Array(count * 3);
    const trunkN = Math.floor(count * 0.08);
    const starN = Math.floor(count * 0.03);
    const foliageN = count - trunkN - starN;
    let idx = 0;

    // Foliage — cone shape with layered look
    for (let i = 0; i < foliageN; i++) {
        const t = Math.random();                     // 0=bottom, 1=top
        const h = t * 4.5 - 1;                      // height range
        const maxR = (1 - t) * 2.2 + 0.05;          // wider at base
        // Add scalloped layers
        const layerWobble = 1 - 0.15 * Math.sin(t * Math.PI * 5);
        const angle = Math.random() * Math.PI * 2;
        const r = Math.sqrt(Math.random()) * maxR * layerWobble;
        pos[idx++] = Math.cos(angle) * r;
        pos[idx++] = h;
        pos[idx++] = Math.sin(angle) * r;
    }
    // Trunk
    for (let i = 0; i < trunkN; i++) {
        const angle = Math.random() * Math.PI * 2;
        const r = Math.sqrt(Math.random()) * 0.3;
        pos[idx++] = Math.cos(angle) * r;
        pos[idx++] = -1 - Math.random() * 1.2;
        pos[idx++] = Math.sin(angle) * r;
    }
    // Star burst at top
    for (let i = 0; i < starN; i++) {
        const angle = Math.random() * Math.PI * 2;
        const phi = Math.random() * Math.PI;
        const r = Math.random() * 0.35;
        pos[idx++] = Math.sin(phi) * Math.cos(angle) * r;
        pos[idx++] = 4.5 + Math.cos(phi) * r;
        pos[idx++] = Math.sin(phi) * Math.sin(angle) * r;
    }
    return pos;
}

// ============================================================
// 2. THREE.JS SCENE
// ============================================================

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(0, 0, 8);
camera.lookAt(0, 0, 0);

const renderer = new THREE.WebGLRenderer({ canvas: canvas3D, antialias: !IS_MOBILE, alpha: false });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.8;

// ── Bloom Post-Processing ──
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));

const bloomPass = new UnrealBloomPass(
    new THREE.Vector2(window.innerWidth, window.innerHeight),
    IS_MOBILE ? 0.3 : 0.4,   // strength (much lower to prevent glare)
    0.6,                       // radius
    0.7                        // threshold (higher = only bright spots glow)
);
composer.addPass(bloomPass);
composer.addPass(new OutputPass());

// ── Create glow sprite texture via canvas ──
function createGlowTexture() {
    const size = 128;
    const c = document.createElement('canvas');
    c.width = c.height = size;
    const ctx = c.getContext('2d');
    const grad = ctx.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
    grad.addColorStop(0, 'rgba(255,255,255,0.9)');
    grad.addColorStop(0.1, 'rgba(255,255,255,0.5)');
    grad.addColorStop(0.35, 'rgba(255,255,255,0.12)');
    grad.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, size, size);
    const tex = new THREE.CanvasTexture(c);
    tex.needsUpdate = true;
    return tex;
}

// ── Particle System ──
const targets    = generateHeart(PARTICLE_COUNT);       // target positions
const velocities = new Float32Array(PARTICLE_COUNT * 3); // per-particle velocity
const positions  = new Float32Array(PARTICLE_COUNT * 3); // current rendered positions
const sizes      = new Float32Array(PARTICLE_COUNT);

// Initialize positions scattered randomly, they'll lerp to targets
for (let i = 0; i < PARTICLE_COUNT; i++) {
    positions[i * 3]     = (Math.random() - 0.5) * 20;
    positions[i * 3 + 1] = (Math.random() - 0.5) * 20;
    positions[i * 3 + 2] = (Math.random() - 0.5) * 20;
    sizes[i] = 0.2 + Math.random() * 0.3;
}

const geometry = new THREE.BufferGeometry();
geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
geometry.setAttribute('size', new THREE.BufferAttribute(sizes, 1));

const material = new THREE.ShaderMaterial({
    uniforms: {
        uColor: { value: state.particleColor },
        uTime: { value: 0 },
        uTexture: { value: createGlowTexture() },
        uPixelRatio: { value: Math.min(window.devicePixelRatio, 2) },
    },
    vertexShader: /* glsl */ `
        attribute float size;
        uniform float uTime;
        uniform float uPixelRatio;
        varying float vAlpha;

        void main() {
            vec4 mv = modelViewMatrix * vec4(position, 1.0);
            float s = size * (180.0 * uPixelRatio / -mv.z);
            // Subtle pulse
            s *= 0.9 + 0.1 * sin(uTime * 2.0 + position.x * 3.0 + position.y * 5.0);
            gl_PointSize = s;
            gl_Position = projectionMatrix * mv;
            vAlpha = smoothstep(50.0, 5.0, -mv.z); // fade distant particles
        }
    `,
    fragmentShader: /* glsl */ `
        uniform vec3 uColor;
        uniform sampler2D uTexture;
        varying float vAlpha;

        void main() {
            vec4 texel = texture2D(uTexture, gl_PointCoord);
            float brightness = texel.r;
            gl_FragColor = vec4(uColor * brightness * 0.7, brightness * vAlpha * 0.85);
        }
    `,
    transparent: true,
    blending: THREE.AdditiveBlending,
    depthWrite: false,
});

const points = new THREE.Points(geometry, material);
scene.add(points);

// ── Background subtle stars ──
(function addStars() {
    const starCount = IS_MOBILE ? 300 : 600;
    const starGeo = new THREE.BufferGeometry();
    const starPos = new Float32Array(starCount * 3);
    for (let i = 0; i < starCount * 3; i++) starPos[i] = (Math.random() - 0.5) * 60;
    starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
    const starMat = new THREE.PointsMaterial({ color: 0x555577, size: 0.08, transparent: true, opacity: 0.6 });
    scene.add(new THREE.Points(starGeo, starMat));
})();

// Sphere targets for circular explosion
const explodeTargets = new Float32Array(PARTICLE_COUNT * 3);
const SPHERE_RADIUS = 6;

/** Generate random positions on a sphere surface for circular burst */
function generateSphereTargets() {
    for (let i = 0; i < PARTICLE_COUNT; i++) {
        const i3 = i * 3;
        // Uniform distribution on sphere surface
        const theta = Math.random() * Math.PI * 2;
        const phi = Math.acos(2 * Math.random() - 1);
        const r = SPHERE_RADIUS * (0.85 + Math.random() * 0.3); // slight radius variation
        explodeTargets[i3]     = Math.sin(phi) * Math.cos(theta) * r;
        explodeTargets[i3 + 1] = Math.sin(phi) * Math.sin(theta) * r;
        explodeTargets[i3 + 2] = Math.cos(phi) * r;
    }
}

function switchShape(shape) {
    if (shape === state.currentShape) return;
    state.currentShape = shape;
    const newTargets = shape === 'heart' ? generateHeart(PARTICLE_COUNT) : generateTree(PARTICLE_COUNT);
    targets.set(newTargets);
}

function triggerExplosion() {
    if (state.isExploding) return;
    state.isExploding = true;
    // Generate new sphere positions each explosion for variety
    generateSphereTargets();
}

function formShape() {
    state.isExploding = false;
}

const EXPLODE_LERP = 0.06; // Speed of expanding to sphere

function updateParticles(time) {
    const posAttr = geometry.attributes.position;
    for (let i = 0; i < PARTICLE_COUNT; i++) {
        const i3 = i * 3;
        if (state.isExploding) {
            // Smoothly lerp toward sphere target positions (circular burst)
            positions[i3]     += (explodeTargets[i3]     - positions[i3])     * EXPLODE_LERP;
            positions[i3 + 1] += (explodeTargets[i3 + 1] - positions[i3 + 1]) * EXPLODE_LERP;
            positions[i3 + 2] += (explodeTargets[i3 + 2] - positions[i3 + 2]) * EXPLODE_LERP;
        } else {
            // Lerp toward target + floating offset
            const floatX = Math.sin(time * 0.8 + i * 0.01) * FLOAT_AMPLITUDE * 0.3;
            const floatY = Math.sin(time * 0.6 + i * 0.013) * FLOAT_AMPLITUDE;
            const floatZ = Math.cos(time * 0.7 + i * 0.009) * FLOAT_AMPLITUDE * 0.3;
            const tx = targets[i3]     + floatX;
            const ty = targets[i3 + 1] + floatY;
            const tz = targets[i3 + 2] + floatZ;
            positions[i3]     += (tx - positions[i3])     * LERP_SPEED;
            positions[i3 + 1] += (ty - positions[i3 + 1]) * LERP_SPEED;
            positions[i3 + 2] += (tz - positions[i3 + 2]) * LERP_SPEED;
        }
    }
    posAttr.needsUpdate = true;
}

// ============================================================
// 4. GESTURE DETECTION (MediaPipe Hands)
// ============================================================

function isFingerUp(landmarks, tipIdx, pipIdx) {
    return landmarks[tipIdx].y < landmarks[pipIdx].y;
}

function countFingersUp(landmarks) {
    let count = 0;
    if (isFingerUp(landmarks, 8, 6))   count++; // Index
    if (isFingerUp(landmarks, 12, 10)) count++; // Middle
    if (isFingerUp(landmarks, 16, 14)) count++; // Ring
    if (isFingerUp(landmarks, 20, 18)) count++; // Pinky
    return count;
}

function processGestures(results) {
    state.handsDetected = results.multiHandLandmarks ? results.multiHandLandmarks.length : 0;

    if (!results.multiHandLandmarks || results.multiHandLandmarks.length === 0) return;

    const now = Date.now();

    for (let i = 0; i < results.multiHandLandmarks.length; i++) {
        const landmarks = results.multiHandLandmarks[i];
        const label = results.multiHandedness[i].label; // "Left" or "Right"

        // MediaPipe Hands: the label refers to the hand in the image.
        // With a front-facing (selfie) camera, "Left" in image = user's RIGHT hand, and vice versa.
        const isUserLeftHand = (label === 'Right');
        const fingers = countFingersUp(landmarks);

        if (isUserLeftHand) {
            // Left hand → shape selection
            state.leftGesture = `${fingers} finger(s)`;
            if (now - lastShapeSwitch > GESTURE_DEBOUNCE_MS) {
                if (fingers === 1) { switchShape('heart'); lastShapeSwitch = now; }
                else if (fingers === 2) { switchShape('tree'); lastShapeSwitch = now; }
            }
        } else {
            // Right hand → explosion control + rotation tracking
            // Track palm position (wrist landmark 0) for rotation
            state.rightHandX = landmarks[9].x; // Middle finger MCP as palm center
            state.rightHandY = landmarks[9].y;
            state.hasRightHand = true;

            if (now - lastExplosionToggle > GESTURE_DEBOUNCE_MS) {
                if (fingers >= 4) {
                    state.rightGesture = 'Open';
                    triggerExplosion();
                    lastExplosionToggle = now;
                } else if (fingers <= 1) {
                    state.rightGesture = 'Fist';
                    formShape();
                    lastExplosionToggle = now;
                }
            }
        }
    }
}

// ── Init MediaPipe Hands ──
function initHands() {
    const videoEl = document.getElementById('webcam-video');
    const camCanvas = document.getElementById('webcam-canvas');
    const camCtx = camCanvas.getContext('2d');

    const hands = new window.Hands({
        locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4/${file}`,
    });
    hands.setOptions({
        maxNumHands: 2,
        modelComplexity: IS_MOBILE ? 0 : 1,
        minDetectionConfidence: 0.6,
        minTrackingConfidence: 0.5,
    });

    hands.onResults((results) => {
        // Draw webcam + landmarks
        camCanvas.width = camCanvas.clientWidth;
        camCanvas.height = camCanvas.clientHeight;
        camCtx.clearRect(0, 0, camCanvas.width, camCanvas.height);
        camCtx.drawImage(results.image, 0, 0, camCanvas.width, camCanvas.height);

        if (results.multiHandLandmarks) {
            for (const landmarks of results.multiHandLandmarks) {
                window.drawConnectors(camCtx, landmarks, window.HAND_CONNECTIONS, { color: '#a78bfa88', lineWidth: 2 });
                window.drawLandmarks(camCtx, landmarks, { color: '#e0e0ff', lineWidth: 1, radius: 2 });
            }
        }

        // Process gestures
        processGestures(results);
    });

    const cam = new window.Camera(videoEl, {
        onFrame: async () => { await hands.send({ image: videoEl }); },
        width: IS_MOBILE ? 320 : 640,
        height: IS_MOBILE ? 240 : 480,
        facingMode: 'user',
    });

    cam.start().then(() => {
        loadingScreen.classList.add('hidden');
        setTimeout(() => { loadingScreen.style.display = 'none'; }, 700);
    });
}

// ============================================================
// 5. UI UPDATES
// ============================================================

function updateUI() {
    // Shape status
    txtShape.textContent = `Shape: ${state.currentShape === 'heart' ? '❤️ Heart' : '🎄 Tree'}`;
    dotShape.className = 'dot ' + (state.currentShape === 'heart' ? 'red' : 'green');

    // Animation state
    txtState.textContent = state.isExploding ? 'State: Exploding 💥' : 'State: Floating ✨';
    dotState.className = 'dot ' + (state.isExploding ? 'amber' : 'green');

    // Hands
    txtHands.textContent = `Hands: ${state.handsDetected > 0 ? state.handsDetected + ' detected' : '—'}`;
    dotHands.className = 'dot ' + (state.handsDetected > 0 ? 'green' : '');
}

colorPicker.addEventListener('input', (e) => {
    state.particleColor.set(e.target.value);
});

// ============================================================
// 6. ANIMATION LOOP
// ============================================================

const clock = new THREE.Clock();

function animate() {
    requestAnimationFrame(animate);
    const elapsed = clock.getElapsedTime();

    // Rotation: right hand controls rotation, otherwise gentle auto-rotate
    if (state.hasRightHand) {
        // Map hand X (0-1, mirrored) to Y rotation (-PI to PI)
        // Map hand Y (0-1) to X rotation (-0.6 to 0.6)
        rotTargetY = (state.rightHandX - 0.5) * Math.PI * 1.5;
        rotTargetX = (state.rightHandY - 0.5) * 1.2;
    } else {
        // Gentle auto-rotation when no right hand detected
        rotTargetY = Math.sin(elapsed * 0.15) * 0.3;
        rotTargetX = Math.sin(elapsed * 0.1) * 0.08;
    }
    // Smooth lerp rotation
    rotCurrentY += (rotTargetY - rotCurrentY) * ROTATION_LERP;
    rotCurrentX += (rotTargetX - rotCurrentX) * ROTATION_LERP;
    points.rotation.y = rotCurrentY;
    points.rotation.x = rotCurrentX;

    material.uniforms.uTime.value = elapsed;
    updateParticles(elapsed);
    updateUI();
    composer.render();

    // Reset right hand flag (will be set again if hand is still detected)
    state.hasRightHand = false;
}

// ── Resize handler ──
window.addEventListener('resize', () => {
    const w = window.innerWidth, h = window.innerHeight;
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    renderer.setSize(w, h);
    composer.setSize(w, h);
    material.uniforms.uPixelRatio.value = Math.min(window.devicePixelRatio, 2);
});

// ── Boot ──
initHands();
animate();
    </script>
